# Dispositivo DAC USB usado con los Moondrop CHU III.
# El nombre estable del nodo se basa en el VID/PID y el perfil ALSA.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.usb-Realtek_UGREEN_CM720_USB_Audio_202312130006-00.analog-stereo"
      }
    ]
    actions = {
      update-props = {
        node.nick = "UGREEN CM720 DAC"
        node.description = "UGREEN CM720 DAC · Moondrop CHU III"
        priority.session = 1200
      }
    }
  }
]
