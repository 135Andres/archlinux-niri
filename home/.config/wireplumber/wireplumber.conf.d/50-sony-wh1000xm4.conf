# Ajustes de audio para el Sony WH-1000XM4 (Bluetooth) en Niri/PipeWire.
#
# 1. LDAC adaptativo: ajusta la tasa de bits segun el enlace Bluetooth.
# 2. Auto-conexion solo del perfil A2DP (calidad) al encender el XM4.
# 3. Volumen por hardware (el volumen del propio XM4) siempre disponible.
# 4. El microfono del XM4 pierde prioridad: las apps usan el microfono del
#    portatil y asi el audio NUNCA baja a HSP/HFP (mono 8 kHz) solo por
#    abrir un micro. Para usar el micro del XM4: audio-mode calls.

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "bluez_card.80_99_E7_AD_CB_98"
      }
    ]
    actions = {
      update-props = {
        bluez5.a2dp.ldac.quality = "auto"
        bluez5.auto-connect = [ a2dp_sink ]
        bluez5.hw-volume = [ a2dp_sink a2dp_source hsp_hs hfp_hf hsp_ag hfp_ag ]
        node.description = "Sony WH-1000XM4 (LDAC)"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        # El XM4 se mantiene despierto aunque no suene nada: evita el
        # suspend/re-suspend del sink (latencia y chasquidos al reanudar).
        session.suspend-timeout-seconds = 0
      }
    }
  }
  {
    matches = [
      {
        node.name = "~bluez_input.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 700
        priority.driver = 700
      }
    }
  }
]
