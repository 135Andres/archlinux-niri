# Audio de alta resolución para el UGREEN CM720 USB Audio.
# El kernel expone para este DAC: 44.1, 48, 88.2, 96, 192 y 384 kHz.
# PipeWire mantiene 48 kHz como reloj base y permite cambiar al rate nativo
# de la pista cuando el DAC lo soporta, evitando resampling innecesario.
context.properties = {
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 192000 384000 ]
}
