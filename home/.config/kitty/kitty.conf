# Kitty — la paleta se carga desde wallpaper-theme.conf
font_family      JetBrainsMono Nerd Font
font_size        11.0
allow_remote_control yes
listen_on unix:/tmp/kitty.sock
shell /usr/bin/zsh

include ~/.config/kitty/wallpaper-theme.conf

copy_on_select clipboard
strip_trailing_spaces smart
enable_audio_bell no
window_padding_width 12
window_border_width 0
draw_minimal_borders yes
hide_window_decorations yes
tab_bar_style hidden
tab_bar_min_tabs 0

# Navegación por palabras con Ctrl + Flechas
map ctrl+left send_text all \x1b[1;5D
map ctrl+right send_text all \x1b[1;5C

# Allow live configuration updates.
dynamic_background_opacity yes

# Fixed 85% background opacity, independent of focus.
background_opacity 0.85
